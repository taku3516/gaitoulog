<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#5081b5" />
    <meta name="description" content="街頭演説・街頭活動の記録・集計・可視化アプリ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="街頭活動ログ" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <title>街頭活動ログ</title>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <!-- Sortable.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- クラウド同期の設定値（未設定なら同期機能は無効のまま） -->
    <script src="data/firebase-config.js"></script>
</head>

<body>
    <div id="app">
        <header class="app-header">
            <h1 class="app-title" id="app-title">街頭活動ログ</h1>
            <select id="politician-select" class="form-select header-select"></select>
        </header>
        <main id="main-content" class="main-content"></main>
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="input" id="nav-input" data-icon="edit">
                <span class="nav-label">入力</span>
            </button>
            <button class="nav-btn" data-view="list" id="nav-list" data-icon="list">
                <span class="nav-label">一覧</span>
            </button>
            <button class="nav-btn" data-view="recommend" id="nav-recommend" data-icon="idea">
                <span class="nav-label">提案</span>
            </button>
            <button class="nav-btn" data-view="dashboard" id="nav-dashboard" data-icon="chart">
                <span class="nav-label">分析</span>
            </button>
            <button class="nav-btn" data-view="settings" id="nav-settings" data-icon="settings">
                <span class="nav-label">設定</span>
            </button>
        </nav>
    </div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
    <!-- app.js より後に読み込む（ブリッジが用意されてから同期を開始するため） -->
    <script type="module" src="js/sync/app-sync.js"></script>
</body>

</html>
