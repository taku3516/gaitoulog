<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#5081b5" />
    <meta name="description" content="街頭演説・街頭活動の記録・集計・可視化アプリ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="街頭活動ログ" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <title>街頭活動ログ</title>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <!-- Sortable.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>

<body>
    <div id="app">
        <header class="app-header">
            <h1 class="app-title">
                <span class="app-icon">📢</span>
                街頭活動ログ
            </h1>
            <select id="politician-select" class="form-select" style="margin-left:auto; width:auto; padding:4px 28px 4px 10px; font-size:0.85rem; min-height:32px; border-color:var(--border-active); font-weight:600;"></select>
        </header>
        <main id="main-content" class="main-content"></main>
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="input" id="nav-input">
                <span class="nav-icon">✏️</span>
                <span class="nav-label">入力</span>
            </button>
            <button class="nav-btn" data-view="list" id="nav-list">
                <span class="nav-icon">📋</span>
                <span class="nav-label">一覧</span>
            </button>
            <button class="nav-btn" data-view="recommend" id="nav-recommend">
                <span class="nav-icon">💡</span>
                <span class="nav-label">提案</span>
            </button>
            <button class="nav-btn" data-view="dashboard" id="nav-dashboard">
                <span class="nav-icon">📊</span>
                <span class="nav-label">分析</span>
            </button>
        </nav>
    </div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
</body>

</html>
