name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # アプリ本体の公開先は Firebase Hosting（gaitoulog.firebaseapp.com）へ移した。
      # 旧URLでは、ホーム画面のアプリからGoogleログインを完了できないため。
      # ここでは移転の案内だけを配信する。
      - name: Upload notice page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-notice

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
