<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログイン診断 - 街頭活動ログ</title>
    <script src="data/firebase-config.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
               margin: 0; padding: 16px; background: #e6eef4; color: #1b2733; line-height: 1.7; }
        h1 { font-size: 18px; margin: 0 0 4px; }
        .lead { font-size: 13px; color: #52616f; margin: 0 0 16px; }
        .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .card h2 { font-size: 14px; margin: 0 0 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; width: 44%; color: #52616f; font-weight: 600; vertical-align: top; padding: 3px 0; }
        td { word-break: break-all; padding: 3px 0; }
        .ok { color: #1a7f4b; font-weight: 700; }
        .ng { color: #b3261e; font-weight: 700; }
        button { width: 100%; padding: 13px; font-size: 15px; font-weight: 700; border: 0;
                 border-radius: 10px; margin-bottom: 8px; background: #5081b5; color: #fff; }
        button.sub { background: #fff; color: #1b2733; border: 1px solid #c3d0dc; }
        #log { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap;
               background: #16212c; color: #d7e3ee; border-radius: 10px; padding: 12px; min-height: 90px; }
        a { color: #5081b5; }
    </style>
</head>
<body>
    <h1>ログイン診断</h1>
    <p class="lead">
        この画面は不具合の原因を突き止めるための一時的なページです。
        下の結果をそのままスクリーンショットで送ってください。
    </p>

    <div class="card">
        <h2>この端末の状態</h2>
        <table id="env"></table>
    </div>

    <div class="card">
        <h2>ログインを試す</h2>
        <button id="try-popup">① ポップアップ方式で試す</button>
        <button id="try-redirect" class="sub">② リダイレクト方式で試す</button>
        <button id="reset" class="sub">記録を消してやり直す</button>
    </div>

    <div class="card">
        <h2>結果</h2>
        <div id="log">読み込み中…</div>
    </div>

    <p class="lead"><a href="./">アプリに戻る</a></p>

    <script type="module">
        // 診断用のため、アプリ本体とは独立して Firebase を読み込む。
        const CONFIG = window.GAITOULOG_FIREBASE_SYNC;
        const BASE = `https://www.gstatic.com/firebasejs/${CONFIG.sdkVersion}`;
        const SESSION_MARK = 'diag_sessionMark';   // sessionStorage: タブが変わると消える
        const LOCAL_MARK = 'diag_localMark';       // localStorage: 端末に残る

        const logEl = document.getElementById('log');
        let lines = [];
        function log(text) {
            const time = new Date().toLocaleTimeString('ja-JP');
            lines.push(`[${time}] ${text}`);
            logEl.textContent = lines.join('\n');
        }

        function row(label, value, judge) {
            const cls = judge === true ? 'ok' : judge === false ? 'ng' : '';
            return `<tr><th>${label}</th><td class="${cls}">${value}</td></tr>`;
        }

        const standalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;

        document.getElementById('env').innerHTML = [
            row('接続先', location.hostname, location.hostname === new URL(`https://${CONFIG.firebaseConfig.authDomain}`).hostname),
            row('authDomain', CONFIG.firebaseConfig.authDomain),
            row('起動のしかた', standalone ? 'ホーム画面のアプリ' : 'ブラウザ', standalone),
            row('端末情報', navigator.userAgent),
        ].join('');

        const { initializeApp } = await import(`${BASE}/firebase-app.js`);
        const auth$ = await import(`${BASE}/firebase-auth.js`);
        const app = initializeApp(CONFIG.firebaseConfig);
        const auth = auth$.getAuth(app);

        // --- 往復して戻ってきたかどうかを判定する ---
        const wentOut = localStorage.getItem(LOCAL_MARK);
        const sessionAlive = sessionStorage.getItem(SESSION_MARK);

        if (wentOut) {
            log(`前回 ${wentOut} 方式で外へ出ました。戻ってきた状態を調べます。`);
            log(sessionAlive
                ? '✅ sessionStorage は残っています（同じタブに戻れています）'
                : '❌ sessionStorage が消えています（別のタブ／再起動で戻っています）');
            log(sessionAlive
                ? '  → Firebase の「リダイレクト中」の印も残っているはずです'
                : '  → Firebase は「リダイレクト中」の印を sessionStorage に置くため、結果を受け取れません');
            localStorage.removeItem(LOCAL_MARK);

            try {
                const result = await auth$.getRedirectResult(auth);
                log(result?.user
                    ? `✅ getRedirectResult: ログイン成功 (${result.user.displayName || 'ユーザー'})`
                    : '❌ getRedirectResult: null（資格情報を受け取れませんでした）');
            } catch (e) {
                log(`❌ getRedirectResult でエラー: ${e?.code || e}`);
            }
        } else {
            log('準備できました。①か②のボタンを押してください。');
        }

        log(`現在のログイン状態: ${auth.currentUser ? '✅ ログイン中 ' + (auth.currentUser.displayName || '') : 'ログインしていません'}`);

        function provider() {
            const p = new auth$.GoogleAuthProvider();
            p.setCustomParameters({ prompt: 'select_account' });
            return p;
        }

        document.getElementById('try-popup').addEventListener('click', async () => {
            log('--- ポップアップ方式を開始します ---');
            try {
                const result = await auth$.signInWithPopup(auth, provider());
                log(`✅ ポップアップ方式で成功しました (${result.user.displayName || 'ユーザー'})`);
            } catch (e) {
                log(`❌ ポップアップ方式は失敗: ${e?.code || e}`);
            }
        });

        document.getElementById('try-redirect').addEventListener('click', async () => {
            log('--- リダイレクト方式を開始します ---');
            sessionStorage.setItem(SESSION_MARK, '1');
            localStorage.setItem(LOCAL_MARK, 'リダイレクト');
            try {
                await auth$.setPersistence(auth, auth$.browserLocalPersistence);
                await auth$.signInWithRedirect(auth, provider());
            } catch (e) {
                localStorage.removeItem(LOCAL_MARK);
                log(`❌ リダイレクトを開始できません: ${e?.code || e}`);
            }
        });

        document.getElementById('reset').addEventListener('click', async () => {
            localStorage.removeItem(LOCAL_MARK);
            sessionStorage.removeItem(SESSION_MARK);
            try { await auth$.signOut(auth); } catch { /* 失敗しても続行 */ }
            lines = [];
            log('記録を消しました。もう一度お試しください。');
        });
    </script>
</body>
</html>
